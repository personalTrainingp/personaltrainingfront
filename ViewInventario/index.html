<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>View Inventario</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
	<link rel="stylesheet" href="./style.css" />
</head>
<body>
	<div class="container-fluid py-3">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h3 class="fw-bold mb-0">GESTION DE INVENTARIO <span class="text-muted fs-5" id="lblEmpresa"></span></h3>
			<img src="../src/assets/images/LOGO_EMPRESA/CIRCUS.png" alt="Circus" style="height: 80px" />
		</div>

		<div id="loading" class="loading-overlay">
			<div class="spinner-border text-primary" role="status"></div>
		</div>
		<div id="errorBox" class="alert alert-danger d-none"></div>

		<!-- TOTAL GENERAL -->
		<div class="card my-3">
			<div class="card-body d-flex flex-wrap gap-5 font-24">
				<div><div>TOTAL CANTIDAD</div><div class="fw-bold" id="totalCantidad">0</div></div>
				<div><div>TOTAL MONTO S/.</div><div class="fw-bold" id="totalSoles">0.00</div></div>
				<div class="text-color-dolar"><div>TOTAL MONTO $</div><div class="fw-bold" id="totalDolares">0.00</div></div>
			</div>
		</div>

		<!-- CARDS DE CHECK (click = filtrar) -->
		<div id="cardsCheck"></div>

		<button id="btnLimpiarFiltro" class="btn btn-secondary mb-3 d-none"></button>

		<!-- LEYENDA -->
		<div class="d-flex flex-wrap align-items-center gap-4 my-3 font-24" id="leyenda">
			<span class="fw-bold">LEYENDA CHECK ID:</span>
		</div>

		<!-- PESTAÑAS POR UBICACION -->
		<ul class="nav nav-tabs flex-nowrap overflow-auto" id="tabs"></ul>

		<div class="d-flex justify-content-between mt-3">
			<input type="text" id="txtBuscar" class="form-control mb-3 w-auto" placeholder="Buscar..." />
		</div>

		<div class="table-responsive">
			<table class="table table-bordered table-striped dataTable-inventario">
				<thead>
					<tr>
						<th class="font-24" data-sort="id">Id</th>
						<th class="font-24 sortable" data-sort="orden">ORDEN</th>
						<th class="font-24 sortable" data-sort="id_color_subrayado">CHECK ID</th>
						<th class="font-24">FOTO</th>
						<th class="font-24 sortable" data-sort="producto">ITEM</th>
						<th class="font-24 sortable" data-sort="marca">MARCA</th>
						<th class="font-24 sortable" data-sort="descripcion">DESCRIPCION</th>
						<th class="font-24 sortable" data-sort="ubicacion">UBIC.</th>
						<th class="font-24 sortable" data-sort="cantidad">CANT.</th>
						<th class="font-24 sortable" data-sort="costo_unitario_soles">COSTO UNIT. S/.</th>
						<th class="font-24 sortable" data-sort="costo_unitario_dolares">COSTO UNIT. $</th>
						<th class="font-24 sortable" data-sort="mano_obra_soles">COSTO MANO OBRA</th>
						<th class="font-24 sortable" data-sort="costo_total_soles">COSTO TOTAL S/.</th>
						<th class="font-24 sortable text-color-dolar fw-bold" data-sort="costo_total_dolares">COSTO TOTAL $</th>
					</tr>
				</thead>
				<tbody id="tbody"></tbody>
			</table>
		</div>

		<!-- PAGINADOR -->
		<div class="d-flex flex-wrap align-items-center justify-content-center gap-2 my-3" id="paginador"></div>
	</div>

	<!-- PREVIEW DE IMAGEN -->
	<div id="imgPreview" class="img-preview d-none">
		<img alt="Preview" />
	</div>

	<script type="module" src="./app.js"></script>
</body>
</html>
